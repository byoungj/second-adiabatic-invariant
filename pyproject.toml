[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "particle_analysis"
version = "0.1.0"
description = "Compute J (second adiabatic invariant) for stellarator configurations"
readme = "README.md"
license = "BSD-3-Clause"
requires-python = ">=3.9"
dependencies = [
    "numpy",
    "scipy",
    "booz_xform",
]

[project.optional-dependencies]
dev = [
    "pytest",
]
